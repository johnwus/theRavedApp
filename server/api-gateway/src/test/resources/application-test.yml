spring:
  application:
    name: api-gateway
  
  # Gateway Configuration for Tests
  cloud:
    gateway:
      routes:
        - id: user-service-test
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**,/api/v1/auth/**
        - id: content-service-test
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/posts/**,/api/v1/media/**
        - id: social-service-test
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/likes/**,/api/v1/comments/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

# Server Configuration for Tests
server:
  port: 8080

# Eureka Configuration for Tests (Disabled)
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# JWT Configuration for Tests
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/auth/realms/test

# Actuator Configuration for Tests
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

# Logging Configuration for Tests
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Test-specific properties
test:
  gateway:
    routes-simplified: true
  security:
    jwt-disabled: true
