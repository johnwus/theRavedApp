# Production Environment Configuration
spring:
  profiles:
    active: production
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI}

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "https://*.raved.app"
              - "https://raved.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "Authorization"
              - "Content-Type"
              - "X-Requested-With"
              - "Accept"
              - "Origin"
              - "Access-Control-Request-Method"
              - "Access-Control-Request-Headers"
            allowCredentials: true
            maxAge: 3600

  # Production Redis
  data:
    redis:
      host: ${REDIS_HOST:redis-cluster}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      ssl: ${REDIS_SSL:true}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

# Production Logging
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web.cors: WARN
    org.springframework.security: INFO
    com.raved: INFO
    io.github.resilience4j: INFO
    reactor.netty: WARN
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  file:
    name: /var/log/raved/api-gateway.log
    max-size: 100MB
    max-history: 30

# Production Eureka
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    hostname: ${HOSTNAME:api-gateway}
    metadata-map:
      zone: ${EUREKA_ZONE:prod-zone}
      version: ${BUILD_VERSION:1.0.0}

# Production Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  security:
    enabled: true

# Production specific settings
raved:
  gateway:
    security:
      jwt:
        secret: ${JWT_SECRET}
        expiration: ${JWT_EXPIRATION:3600000} # 1 hour in production

    rate-limiting:
      enabled: true
      default-limit: ${DEFAULT_RATE_LIMIT:50} # More restrictive in production
      auth-limit: ${AUTH_RATE_LIMIT:5}
      payment-limit: ${PAYMENT_RATE_LIMIT:10}

    monitoring:
      tracing:
        enabled: true
        sample-rate: ${TRACING_SAMPLE_RATE:0.1} # Sample 10% in production
      metrics:
        enabled: true

    circuit-breaker:
      enabled: true
      failure-threshold: ${CB_FAILURE_THRESHOLD:30} # More sensitive in production
      timeout: ${CB_TIMEOUT:3000} # Shorter timeout in production

# Production Security
server:
  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: ${SSL_KEYSTORE_PATH:/etc/ssl/keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12