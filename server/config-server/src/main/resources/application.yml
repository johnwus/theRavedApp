# Config Server Configuration
server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/johnwus/theRavedApp-config}
          default-label: ${CONFIG_GIT_BRANCH:main}
          clone-on-start: ${CONFIG_CLONE_ON_START:false}
          search-paths: ${CONFIG_GIT_PATHS:}
        native:
          search-locations: classpath:/config

# Optional: register with Eureka if discovery is used
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.config: INFO
