# Social Service Configuration
spring:
  application:
    name: social-service
  datasource:
    url: ${SOCIAL_DB_URL:jdbc:postgresql://localhost:5432/raved_social}
    username: ${SOCIAL_DB_USER:social_user}
    password: ${SOCIAL_DB_PASSWORD:social_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SOCIAL_DDL_AUTO:validate}
    show-sql: ${SOCIAL_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${SOCIAL_REDIS_DB:4}

# Social media configuration
social:
  features:
    posts: ${SOCIAL_POSTS_ENABLED:true}
    comments: ${SOCIAL_COMMENTS_ENABLED:true}
    likes: ${SOCIAL_LIKES_ENABLED:true}
    shares: ${SOCIAL_SHARES_ENABLED:true}
    stories: ${SOCIAL_STORIES_ENABLED:true}
    groups: ${SOCIAL_GROUPS_ENABLED:true}
    events: ${SOCIAL_EVENTS_ENABLED:true}
  
  limits:
    max-post-length: ${SOCIAL_MAX_POST_LENGTH:1000}
    max-comment-length: ${SOCIAL_MAX_COMMENT_LENGTH:500}
    max-likes-per-post: ${SOCIAL_MAX_LIKES_PER_POST:10000}
    max-comments-per-post: ${SOCIAL_MAX_COMMENTS_PER_POST:1000}
    max-posts-per-day: ${SOCIAL_MAX_POSTS_PER_DAY:10}
  
  moderation:
    enabled: ${SOCIAL_MODERATION_ENABLED:true}
    auto-flag: ${SOCIAL_AUTO_FLAG:true}
    profanity-filter: ${SOCIAL_PROFANITY_FILTER:true}
    spam-detection: ${SOCIAL_SPAM_DETECTION:true}

# Content storage configuration
storage:
  type: ${STORAGE_TYPE:local}
  local:
    path: ${LOCAL_STORAGE_PATH:./uploads/social}
    max-file-size: ${MAX_FILE_SIZE:10485760}
  s3:
    bucket: ${S3_BUCKET:raved-social-content}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  
  allowed-types:
    - image/jpeg
    - image/png
    - image/gif
    - video/mp4
    - video/quicktime

# Search configuration
search:
  engine: ${SEARCH_ENGINE:elasticsearch}
  elasticsearch:
    host: ${ELASTICSEARCH_HOST:localhost}
    port: ${ELASTICSEARCH_PORT:9200}
    index-prefix: ${ELASTICSEARCH_INDEX_PREFIX:raved-social}
  
  indexing:
    auto-index: ${AUTO_INDEX:true}
    batch-size: ${INDEX_BATCH_SIZE:100}
    refresh-interval: ${INDEX_REFRESH_INTERVAL:1s}

# Kafka configuration for social events
kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer:
    group-id: ${SOCIAL_KAFKA_GROUP:social-consumer}
    auto-offset-reset: ${SOCIAL_KAFKA_OFFSET:earliest}
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Metrics and monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}

# Logging configuration
logging:
  level:
    com.raved.social: ${SOCIAL_LOG_LEVEL:INFO}
    org.springframework.kafka: ${KAFKA_LOG_LEVEL:WARN}
    org.elasticsearch: ${ELASTICSEARCH_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
