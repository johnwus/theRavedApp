server:
  port: 8082

spring:
  application:
    name: content-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# =============================================================================
# RAVED CONFIGURATION
# =============================================================================
raved:
  service:
    name: content-service
  database:
    environment: ${SPRING_PROFILES_ACTIVE:local}

# =============================================================================
# MONGODB CONFIGURATION (Primary for Content Service)
# =============================================================================
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://raved_admin:raved_password@localhost:27017/raved_content?authSource=admin}
      database: ${MONGODB_DATABASE:raved_content}
      auto-index-creation: true

# =============================================================================
# REDIS CONFIGURATION (Caching)
# =============================================================================
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6380}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# =============================================================================
# AWS S3 CONFIGURATION (Media Storage)
# =============================================================================
aws:
  access:
    key:
      id: ${AWS_ACCESS_KEY_ID:your-access-key}
    secret:
      key: ${AWS_SECRET_ACCESS_KEY:your-secret-key}
  s3:
    region: ${AWS_S3_REGION:us-east-1}
    bucket:
      name: ${AWS_S3_BUCKET_NAME:raved-content-media}

# =============================================================================
# PROFILE-SPECIFIC CONFIGURATIONS
# =============================================================================

---
# LOCAL DEVELOPMENT PROFILE
spring:
  config:
    activate:
      on-profile: local
  # MongoDB Configuration (Primary)
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://raved_admin:raved_password@localhost:27017/raved_content?authSource=admin}
      database: ${MONGODB_DATABASE:raved_content}
      auto-index-creation: true
  
  

---
# STAGING PROFILE
spring:
  config:
    activate:
      on-profile: staging
  # MongoDB Configuration (Primary)
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://raved_admin:raved_password@localhost:27017/raved_content?authSource=admin}
      database: ${MONGODB_DATABASE:raved_content}
      auto-index-creation: true

---
# PRODUCTION PROFILE
spring:
  config:
    activate:
      on-profile: production
  # MongoDB Configuration (Primary)
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://raved_admin:raved_password@localhost:27017/raved_content?authSource=admin}
      database: ${MONGODB_DATABASE:raved_content}
      auto-index-creation: true
  
 

# =============================================================================
# COMMON MICROSERVICE CONFIGURATION
# =============================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.raved: ${LOG_LEVEL:DEBUG}
    org.springframework.data.mongodb: ${LOG_LEVEL:DEBUG}
  file:
    name: ${LOG_FILE_PATH:./logs}/${spring.application.name}.log
