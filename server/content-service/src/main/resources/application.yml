server:
  port: 8082

spring:
  application:
    name: content-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# =============================================================================
# RAVED CONFIGURATION
# =============================================================================
raved:
  service:
    name: content-service
  database:
    environment: ${SPRING_PROFILES_ACTIVE:local}

# =============================================================================
# MONGODB CONFIGURATION (Primary for Content Service)
# =============================================================================
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://raved_admin:theRAVEDapp#123@localhost:27017/raved_content?authSource=admin}
      database: ${MONGODB_DATABASE:raved_content}
      auto-index-creation: true

# =============================================================================
# REDIS CONFIGURATION (Caching)
# =============================================================================
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# =============================================================================
# ELASTICSEARCH CONFIGURATION (Search & Analytics)
# =============================================================================
    elasticsearch:
      uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}
      connection-timeout: 5s
      socket-timeout: 30s

# =============================================================================
# KAFKA CONFIGURATION (Event Streaming)
# =============================================================================
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: content-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.raved.content.dto,com.raved.common.dto"

# =============================================================================
# AWS S3 CONFIGURATION (Media Storage)
# =============================================================================
aws:
  access:
    key:
      id: ${AWS_ACCESS_KEY_ID:your-access-key}
    secret:
      key: ${AWS_SECRET_ACCESS_KEY:your-secret-key}
  s3:
    region: ${AWS_S3_REGION:us-east-1}
    bucket:
      name: ${AWS_S3_BUCKET_NAME:raved-content-media}

# =============================================================================
# PROFILE-SPECIFIC CONFIGURATIONS
# =============================================================================

---
# LOCAL DEVELOPMENT PROFILE
spring:
  config:
    activate:
      on-profile: local
  # MongoDB Configuration (Primary)
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://raved_admin:theRAVEDapp#123@localhost:27017/raved_content?authSource=admin}
      database: ${MONGODB_DATABASE:raved_content}
      auto-index-creation: true
    # Elasticsearch Configuration
    elasticsearch:
      uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}

---
# STAGING PROFILE
spring:
  config:
    activate:
      on-profile: staging
  # MongoDB Configuration (Primary)
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:raved_content}
      auto-index-creation: true
    # Elasticsearch Configuration
    elasticsearch:
      uris: ${ELASTICSEARCH_URIS}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}

---
# PRODUCTION PROFILE
spring:
  config:
    activate:
      on-profile: production
  # MongoDB Configuration (Primary)
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:raved_content}
      auto-index-creation: true
    # Elasticsearch Configuration
    elasticsearch:
      uris: ${ELASTICSEARCH_URIS}
      username: ${ELASTICSEARCH_USERNAME}
      password: ${ELASTICSEARCH_PASSWORD}
  
 

# =============================================================================
# COMMON MICROSERVICE CONFIGURATION
# =============================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.raved: ${LOG_LEVEL:DEBUG}
    org.springframework.data.mongodb: ${LOG_LEVEL:DEBUG}
  file:
    name: ${LOG_FILE_PATH:./logs}/${spring.application.name}.log
