server:
  port: 8086

spring:
  application:
    name: notification-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# =============================================================================
# RAVED CONFIGURATION
# =============================================================================
raved:
  service:
    name: notification-service
  database:
    environment: ${SPRING_PROFILES_ACTIVE:local}

# =============================================================================
# MONGODB CONFIGURATION (Primary for Notification Service)
# =============================================================================
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://raved_admin:theRAVEDapp#123@localhost:27017/raved_notifications?authSource=admin}
      database: ${MONGODB_DATABASE:raved_notifications}
      auto-index-creation: true

# =============================================================================
# PROFILE-SPECIFIC CONFIGURATIONS
# =============================================================================

---
# LOCAL DEVELOPMENT PROFILE
spring:
  config:
    activate:
      on-profile: local
  # MongoDB Configuration (Primary)
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://raved_admin:theRAVEDapp#123@localhost:27017/raved_notifications?authSource=admin}
      database: ${MONGODB_DATABASE:raved_notifications}
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 1
      buffer-memory: 33554432
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true
      auto-commit-interval: 1000
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
    from: ${MAIL_FROM:noreply@raved.app}

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.raved: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Kafka Topics Configuration
kafka:
  topics:
    notification-events: notification-events
    user-events: user-events
    social-events: social-events
    ecommerce-events: ecommerce-events
  consumer:
    group-id: notification-service

# Firebase Configuration (for push notifications)
firebase:
  config-path: ${FIREBASE_CONFIG_PATH:classpath:firebase-service-account.json}
  database-url: ${FIREBASE_DATABASE_URL:https://your-project.firebaseio.com}

# SMS Configuration (Twilio)
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:your-account-sid}
  auth-token: ${TWILIO_AUTH_TOKEN:your-auth-token}
  phone-number: ${TWILIO_PHONE_NUMBER:+1234567890}

# Application Configuration
app:
  name: RAvED
  url: https://app.raved.com
  support-email: support@raved.app

---
# STAGING PROFILE (MongoDB primary)
spring:
  config:
    activate:
      on-profile: staging
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb:27017/raved_notifications}
      database: ${MONGODB_DATABASE:raved_notifications}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

---

# PRODUCTION PROFILE
spring:
  config:
    activate:
      on-profile: production
  # MongoDB Configuration (Primary)
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:raved_notifications}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

# =============================================================================
# NOTIFICATION SERVICE SPECIFIC CONFIGURATION
# =============================================================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
# =============================================================================
# COMMON MICROSERVICE CONFIGURATION
# =============================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.raved: ${LOG_LEVEL:DEBUG}
  file:
    name: ${LOG_FILE_PATH:./logs}/${spring.application.name}.log
