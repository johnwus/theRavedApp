server:
  port: 8087

spring:
  application:
    name: analytics-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# =============================================================================
# RAVED CONFIGURATION
# =============================================================================
raved:
  service:
    name: analytics-service
  database:
    environment: ${SPRING_PROFILES_ACTIVE:local}

# =============================================================================
# MONGODB CONFIGURATION (Primary for Analytics Service)
# =============================================================================
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://raved_admin:theRAVEDapp#123@localhost:27017/raved_analytics?authSource=admin}
      database: ${MONGODB_DATABASE:raved_analytics}
      auto-index-creation: true

# =============================================================================
# ELASTICSEARCH CONFIGURATION (Analytics & Search)
# =============================================================================
    elasticsearch:
      uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}
      connection-timeout: 5s
      socket-timeout: 30s

# =============================================================================
# REDIS CONFIGURATION (Caching)
# =============================================================================
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:1}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# =============================================================================
# KAFKA CONFIGURATION (Event Streaming)
# =============================================================================
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: analytics-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.raved.analytics.dto,com.raved.common.dto"

# =============================================================================
# ANALYTICS CONFIGURATION
# =============================================================================
analytics:
  processing:
    batch-size: 1000
    processing-interval: 60s
    retention-days: 365
  metrics:
    calculation-interval: 300s # 5 minutes
    aggregation-window: 3600s # 1 hour
  elasticsearch:
    index-prefix: "analytics"
    bulk-size: 500
    flush-interval: 30s
  cache:
    ttl: 300s # 5 minutes
    max-size: 10000

# =============================================================================
# PROFILE-SPECIFIC CONFIGURATIONS
# =============================================================================

---
# LOCAL DEVELOPMENT PROFILE
spring:
  config:
    activate:
      on-profile: local
  # MongoDB Configuration (Primary)
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://raved_admin:theRAVEDapp#123@localhost:27017/raved_analytics?authSource=admin}
      database: ${MONGODB_DATABASE:raved_analytics}
      auto-index-creation: true
    # Elasticsearch Configuration
    elasticsearch:
      uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}

---
# STAGING PROFILE
spring:
  config:
    activate:
      on-profile: staging
  # MongoDB Configuration (Primary)
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:raved_analytics}
      auto-index-creation: true
    # Elasticsearch Configuration
    elasticsearch:
      uris: ${ELASTICSEARCH_URIS}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}

---
# PRODUCTION PROFILE
spring:
  config:
    activate:
      on-profile: production
  # MongoDB Configuration (Primary)
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:raved_analytics}
      auto-index-creation: true
    # Elasticsearch Configuration
    elasticsearch:
      uris: ${ELASTICSEARCH_URIS}
      username: ${ELASTICSEARCH_USERNAME}
      password: ${ELASTICSEARCH_PASSWORD}

# =============================================================================
# COMMON MICROSERVICE CONFIGURATION
# =============================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.raved: ${LOG_LEVEL:DEBUG}
    org.springframework.data.mongodb: ${LOG_LEVEL:DEBUG}
    org.springframework.data.elasticsearch: ${LOG_LEVEL:DEBUG}
    org.springframework.kafka: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:./logs}/${spring.application.name}.log
