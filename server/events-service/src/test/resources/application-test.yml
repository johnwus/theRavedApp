spring:
  application:
    name: events-service
  
  # Test Database Configuration
  datasource:
    url: jdbc:h2:mem:events_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA Configuration for Tests
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # Flyway Configuration for Tests (Disabled)
  flyway:
    enabled: false

# Eureka Configuration for Tests (Disabled)
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Actuator Configuration for Tests
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging Configuration for Tests
logging:
  level:
    com.raved.events: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Test-specific properties
test:
  database:
    cleanup: true
