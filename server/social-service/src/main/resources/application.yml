server:
  port: 8083

spring:
  application:
    name: social-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

# =============================================================================
# RAVED CONFIGURATION
# =============================================================================
raved:
  service:
    name: social-service
  database:
    environment: ${SPRING_PROFILES_ACTIVE:local}

# =============================================================================
# PROFILE-SPECIFIC CONFIGURATIONS
# =============================================================================

---
# LOCAL DEVELOPMENT PROFILE
spring:
  profiles: local
  data:
    mongodb:
      uri: ${SOCIAL_SERVICE_MONGODB_URI:mongodb://raved_admin:theRAVEDapp#123@localhost:27017/raved_social?authSource=admin}
      database: ${SOCIAL_SERVICE_MONGODB_DATABASE:raved_social}
      auto-index-creation: true
  redis:
    host: ${SOCIAL_SERVICE_REDIS_HOST:localhost}
    port: ${SOCIAL_SERVICE_REDIS_PORT:6379}
    password: ${SOCIAL_SERVICE_REDIS_PASSWORD:}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 10
        max-idle: 5
        min-idle: 2

---
# STAGING PROFILE (MongoDB Cloud)
spring:
  profiles: staging
  data:
    mongodb:
      uri: ${SOCIAL_SERVICE_MONGODB_URI}
      database: ${SOCIAL_SERVICE_MONGODB_DATABASE}
      auto-index-creation: true
  redis:
    host: ${SOCIAL_SERVICE_REDIS_HOST}
    port: ${SOCIAL_SERVICE_REDIS_PORT:6379}
    password: ${SOCIAL_SERVICE_REDIS_PASSWORD}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 15
        max-idle: 8
        min-idle: 3

---
# PRODUCTION PROFILE (MongoDB Cloud)
spring:
  profiles: production
  data:
    mongodb:
      uri: ${SOCIAL_SERVICE_MONGODB_URI}
      database: ${SOCIAL_SERVICE_MONGODB_DATABASE}
      auto-index-creation: true
  redis:
    host: ${SOCIAL_SERVICE_REDIS_HOST}
    port: ${SOCIAL_SERVICE_REDIS_PORT:6379}
    password: ${SOCIAL_SERVICE_REDIS_PASSWORD}
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

# =============================================================================
# COMMON MICROSERVICE CONFIGURATION
# =============================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.raved: ${LOG_LEVEL:DEBUG}
  file:
    name: ${LOG_FILE_PATH:./logs}/${spring.application.name}.log
