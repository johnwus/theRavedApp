name: Performance Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/testing/performance-tests.sh'
      - '.github/workflows/performance-test.yml'

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run performance tests
        run: |
          chmod +x scripts/testing/performance-tests.sh
          scripts/testing/performance-tests.sh

