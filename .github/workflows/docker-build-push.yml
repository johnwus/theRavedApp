name: Reusable - Docker Build and Push

on:
  workflow_call:
    inputs:
      service:
        description: 'Service directory name under server/'
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_NAMESPACE: raved
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server/${{ inputs.service }}
          push: true
          tags: |
            ${{ env.DOCKER_NAMESPACE }}/${{ inputs.service }}:latest
            ${{ env.DOCKER_NAMESPACE }}/${{ inputs.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

