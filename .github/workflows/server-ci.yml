name: Server CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [ main, develop, 'feature/**', 'test/**', 'bugfix/**' ]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Specific service to test (optional, tests all if empty)'
        required: false
        type: string
      skip_docker:
        description: 'Skip Docker build and push'
        required: false
        type: boolean
        default: false

env:
  JAVA_VERSION: '21'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          user-service,
          social-service,
          ecommerce-service,
          content-service,
          notification-service,
          analytics-service,
          realtime-service,
          events-service,
          subscription-service
        ]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: raved_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      mongodb:
        image: mongo:6-jammy
        env:
          MONGO_INITDB_DATABASE: raved_test
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache TestContainers
        uses: actions/cache@v4
        with:
          path: ~/.testcontainers
          key: ${{ runner.os }}-testcontainers-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-testcontainers-
      - name: Check if service exists
        id: check_service
        run: |
          if [ -d "server/${{ matrix.service }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Service ${{ matrix.service }} found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Service ${{ matrix.service }} not found, skipping"
          fi
      - name: Run unit tests for ${{ matrix.service }}
        if: steps.check_service.outputs.exists == 'true'
        run: |
          cd server/${{ matrix.service }}
          echo "Running tests for ${{ matrix.service }}"
          mvn clean test -B -Dspring.profiles.active=test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/raved_test
          SPRING_DATASOURCE_USERNAME: test_user
          SPRING_DATASOURCE_PASSWORD: test_pass
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/raved_test
      - name: Build ${{ matrix.service }}
        if: steps.check_service.outputs.exists == 'true'
        run: |
          cd server/${{ matrix.service }}
          echo "Building ${{ matrix.service }}"
          mvn clean compile -B
      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: (success() || failure()) && steps.check_service.outputs.exists == 'true'
        with:
          name: Maven Tests - ${{ matrix.service }}
          path: server/${{ matrix.service }}/target/surefire-reports/*.xml
          reporter: java-junit
      - name: Run integration tests (Testcontainers) for PostgreSQL services
        if: steps.check_service.outputs.exists == 'true' && contains(fromJson('["user-service", "ecommerce-service", "realtime-service", "events-service", "subscription-service"]'), matrix.service)
        env:
          SPRING_DATASOURCE_URL: jdbc:tc:postgresql:15-alpine:///raved_test
          TESTCONTAINERS_RYUK_DISABLED: true
        run: |
          cd server/${{ matrix.service }}
          echo "Running integration tests for ${{ matrix.service }}"
          if [ -f "pom.xml" ] && grep -q "with-it" pom.xml; then
            mvn -Pwith-it verify -B
          else
            echo "No integration test profile found, skipping"
          fi

  code-quality:
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-sonar-
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build with quality gates
        run: |
          cd server
          mvn -q clean verify
      - name: SonarCloud analyze
        if: ${{ secrets.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd server
          mvn -q sonar:sonar \
            -Dsonar.projectKey=raved-platform \
            -Dsonar.organization=raved \
            -Dsonar.host.url=https://sonarcloud.io
      - name: Skip SonarCloud (no token)
        if: ${{ secrets.SONAR_TOKEN == '' }}
        run: |
          echo "SonarCloud analysis skipped - SONAR_TOKEN not configured"

  docker-build:
    needs: [backend-test]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [
          user-service,
          social-service,
          ecommerce-service,
          content-service,
          notification-service,
          analytics-service,
          realtime-service,
          events-service,
          subscription-service
        ]
    uses: ./.github/workflows/docker-build-push.yml
    with:
      service: ${{ matrix.service }}
    secrets: inherit

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment"
          # Add deployment commands here

  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-build, code-quality]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Deploying to production environment"
          # Add deployment commands here

