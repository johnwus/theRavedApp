name: Server CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '21'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          user-service,
          social-service,
          ecommerce-service,
          content-service,
          notification-service,
          analytics-service,
          realtime-service,
          events-service,
          subscription-service
        ]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: raved_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Run unit tests for ${{ matrix.service }}
        run: |
          cd server/${{ matrix.service }}
          mvn -q clean test -B
      - name: Build ${{ matrix.service }}
        run: |
          cd server/${{ matrix.service }}
          mvn -q clean compile -B
      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Maven Tests - ${{ matrix.service }}
          path: server/${{ matrix.service }}/target/surefire-reports/*.xml
          reporter: java-junit
      - name: Run integration tests (Testcontainers) for user-service
        if: matrix.service == 'user-service'
        env:
          SPRING_DATASOURCE_URL: jdbc:tc:postgresql:15-alpine:///raved_test
        run: |
          cd server/user-service
          mvn -q -Pwith-it verify

  code-quality:
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build with quality gates
        run: |
          cd server
          mvn -q clean verify
      - name: SonarCloud analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd server
          mvn -q sonar:sonar \
            -Dsonar.projectKey=raved-platform \
            -Dsonar.organization=raved \
            -Dsonar.host.url=https://sonarcloud.io

  docker-build:
    needs: [backend-test]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [
          user-service,
          social-service,
          ecommerce-service,
          content-service,
          notification-service,
          analytics-service,
          realtime-service,
          events-service,
          subscription-service
        ]
    uses: ./.github/workflows/docker-build-push.yml
    with:
      service: ${{ matrix.service }}
    secrets: inherit

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment"
          # Add deployment commands here

  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-build, code-quality]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Deploying to production environment"
          # Add deployment commands here

