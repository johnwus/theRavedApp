apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: raved-dev
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels: { app: mongodb }
  template:
    metadata:
      labels: { app: mongodb }
    spec:
      containers:
        - name: mongodb
          image: mongo:6
          ports: [{ containerPort: 27017 }]

