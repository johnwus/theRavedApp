apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: raved-dev
spec:
  serviceName: elasticsearch
  selector: { matchLabels: { app: elasticsearch } }
  template:
    metadata:
      labels: { app: elasticsearch }
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
          ports: [{ containerPort: 9200 }]

