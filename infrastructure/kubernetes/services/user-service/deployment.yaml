apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: raved-dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
        - name: user-service
          image: raved/user-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-service-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 768Mi

