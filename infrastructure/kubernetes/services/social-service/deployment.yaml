apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-service
  namespace: raved-dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: social-service }
  template:
    metadata:
      labels: { app: social-service }
    spec:
      containers:
        - name: social-service
          image: raved/social-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: social-service-config
            - configMapRef:
                name: mongodb-config
            - secretRef:
                name: social-service-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 768Mi

