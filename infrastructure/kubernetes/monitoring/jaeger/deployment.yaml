apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: raved-dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.50
          ports: [{ containerPort: 16686 }]

