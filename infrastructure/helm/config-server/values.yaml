workload:
  nameOverride: config-server
  image:
    repository: ghcr.io/theravedapp
    tag: latest
  service:
    port: 8888
  autoscaling:
    enabled: false
  probes:
    liveness:
      path: /actuator/health
      initialDelaySeconds: 30
    readiness:
      path: /actuator/health
      initialDelaySeconds: 10
  envFrom:
    - configMapRef:
        name: common-config

