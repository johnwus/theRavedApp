nameOverride: subscription-service
image:
  repository: ghcr.io/theravedapp
  tag: prod
service:
  port: 8089
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
envFrom:
  - configMapRef:
      name: common-config
  - configMapRef:
      name: subscription-service-config
  - secretRef:
      name: subscription-service-secrets
probes:
  liveness:
    path: /actuator/health
    initialDelaySeconds: 45
  readiness:
    path: /actuator/health
    initialDelaySeconds: 15

