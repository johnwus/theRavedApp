nameOverride: user-service
image:
  repository: ghcr.io/theravedapp
  tag: staging
service:
  port: 8081
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: user.staging.raved.local
      path: /
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  - name: SPRING_PROFILES_ACTIVE
    value: staging
  - name: EUREKA_SERVER_URL
    value: http://eureka-server.raved-staging.svc.cluster.local:8761/eureka/
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: kafka.raved-staging.svc.cluster.local:9092
  - name: SPRING_DATASOURCE_URL
    value: ${SPRING_DATASOURCE_URL}
secretEnv:
  DATABASE_USERNAME:
    name: raved-db
    key: username
  DATABASE_PASSWORD:
    name: raved-db
    key: password
secrets:
  - name: raved-db
    absoluteName: true
    data:
      username: ${DATABASE_USERNAME}
      password: ${DATABASE_PASSWORD}

